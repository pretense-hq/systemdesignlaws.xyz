name: Weekly Publish

# Cloud replacement for the local macOS LaunchAgent. Runs the newsletter
# orchestration agent in GitHub Actions (nothing local). Any org member can
# trigger it from the Actions tab.

on:
  schedule:
    - cron: '30 12 * * 0'   # Sunday 12:30 UTC == 18:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (draft = write + validate only, never publishes)'
        type: choice
        default: draft
        options:
          - draft
          - publish

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-publish
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create venv and install Python deps
        run: |
          python3 -m venv newsletter/scripts/.venv
          newsletter/scripts/.venv/bin/pip install -q --upgrade pip
          newsletter/scripts/.venv/bin/pip install -q -r newsletter/scripts/requirements.txt

      - name: Install diagram export tooling (best-effort; reused SVGs need none)
        continue-on-error: true
        run: |
          npm i -g excalidraw-brute-export-cli || true
          npx --yes playwright install firefox || true

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Write CI environment file (credentials + curriculum source)
        env:
          SUBSTACK_COOKIES: ${{ secrets.SUBSTACK_COOKIES }}
          CURRICULUM_BASE_URL: ${{ vars.CURRICULUM_BASE_URL || secrets.CURRICULUM_BASE_URL || '' }}
        run: |
          set -euo pipefail
          umask 077
          # Never echo secret values to the log; only key names are printed.
          printf 'SUBSTACK_COOKIES=%s\n' "$SUBSTACK_COOKIES" > newsletter/scripts/.env
          if [ -n "$CURRICULUM_BASE_URL" ]; then
            printf 'CURRICULUM_BASE_URL=%s\n' "$CURRICULUM_BASE_URL" >> newsletter/scripts/.env
            echo "Wrote keys: SUBSTACK_COOKIES, CURRICULUM_BASE_URL"
          else
            echo "Wrote keys: SUBSTACK_COOKIES (CURRICULUM_BASE_URL not configured; researcher uses local curriculum fallback)"
          fi

      - name: Run weekly orchestration
        env:
          MODE: ${{ github.event.inputs.mode || 'publish' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash .github/scripts/run_weekly_ci.sh

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-log
          path: .github/automation-logs/run.log
          if-no-files-found: ignore

      - name: Commit results back via PR (draft / backlog)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
          BRANCH: weekly/results-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Scope strictly to content paths — never the venv, .env, or logs.
          # (newsletter/published is gitignored, so it is intentionally not added.)
          git add -- newsletter/drafts newsletter/backlog.json
          if git diff --staged --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          # main is protected (PR-only merges), so push a results branch and open a
          # PR. test.yml auto-merges it once the required checks pass. Any push or
          # PR-creation failure must fail this step loudly — a swallowed failure
          # here means backlog.json never advances and the same topic is
          # reselected forever.
          git checkout -b "$BRANCH"
          git commit -m "chore(weekly): $MODE run — newsletter update"
          git push origin "$BRANCH"
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "chore(weekly): $MODE run results (run ${{ github.run_id }})" \
            --body "Automated weekly $MODE run: draft and backlog updates. Auto-merges via test.yml once the required checks (test, e2e-website) pass."

name: Update Recent Posts

permissions:
  contents: write

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC
  workflow_dispatch:      # Manual trigger from Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Substack feed and update recent-posts.json
        run: |
          set -euo pipefail
          FEED_URL="https://newsletter.systemdesignlaws.xyz/feed"
          if ! curl -sfL "$FEED_URL" -o feed.xml; then
            echo "::error::Failed to fetch RSS feed from $FEED_URL (curl returned non-zero; HTTP error or network failure)"
            exit 1
          fi
          if ! python3 .github/scripts/fetch_recent_posts.py; then
            echo "::error::fetch_recent_posts.py failed - feed.xml may not be a valid RSS feed (did $FEED_URL redirect to an HTML page?)"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recent-posts.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update recent posts from Substack"
            git push
          fi

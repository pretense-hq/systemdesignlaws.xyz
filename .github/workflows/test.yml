name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r newsletter/scripts/requirements.txt

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate recent-posts.json schema (if exists)
        run: |
          if [ -f recent-posts.json ]; then
            python3 -c "import json; d=json.load(open('recent-posts.json')); assert 'posts' in d and all('title' in p and 'url' in p and 'description' in p for p in d['posts'])"
          fi

      - name: Newsletter draft dry-run (if newsletter/ exists)
        run: |
          if [ -d newsletter ] && [ -f newsletter/scripts/create_draft.py ]; then
            pip install -q python-substack 2>/dev/null || true
            python3 newsletter/scripts/create_draft.py --dry-run || echo "Dry-run skipped (no credentials)"
          fi

      - name: Validate index.html structure
        run: |
          # Each assertion must gate the step: `grep && echo` swallows failures
          # under `set -e` when the grep is a non-final member of an && list.
          check() {
            if grep -q "$1" index.html; then
              echo "OK: $2"
            else
              echo "FAIL: $2 (pattern not found: $1)"
              exit 1
            fi
          }
          check '<div class="recent-list" id="recent-list">' "Recent Issues container"
          check 'id="recent-posts-data"' "Inline posts data"
          check 'recent-posts.json' "Dynamic fetch"
          check 'id="recent-updated"' "Last updated container"
          check 'id="subscribe-section"' "Substack email signup section"
          check 'newsletter.systemdesignlaws.xyz' "Subscribe links point to newsletter subdomain"
          check 'guardrail-issue' "Frontend guardrail fallback"

  e2e-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run E2E website tests
        run: python3 -m unittest tests.e2e_website_test -v

  merge:
    name: Auto-merge PR
    runs-on: ubuntu-latest
    needs: [test, e2e-website]
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.base_ref == 'main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR (never delete main)
        run: |
          echo "All checks passed. Merging PR (deletes feature branch only, main is protected)."
          # --repo lets gh operate via the API without a local checkout
          # (this job has no actions/checkout step).
          gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
